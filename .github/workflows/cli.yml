name: Desktop CLI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ./bridge
      - run: python -m unittest discover -s bridge
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix integration
      - run: npx playwright-core install chromium
        working-directory: integration
      - run: node integration/desktop-cli.mjs
