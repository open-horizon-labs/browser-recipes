<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Recipes settings</title>
    <link rel="stylesheet" href="options.css">
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <main>
      <h1>Tab Recipes settings</h1>
      <section aria-labelledby="access-heading">
        <h2 id="access-heading">Site access</h2>
        <p>Grant each origin you want recipes to use. A run always needs a specific tab ID.</p>
        <ul id="origins"></ul>
      </section>
      <section aria-labelledby="catalog-heading">
        <h2 id="catalog-heading">Installed adapters</h2>
        <label for="catalog">Local adapter catalog (JSON array)</label>
        <textarea id="catalog" rows="11" spellcheck="false"></textarea>
        <div class="actions">
          <label for="catalog-file">Load a JSON file into the editor
            <input id="catalog-file" type="file" accept=".json,application/json">
          </label>
          <button type="button" id="save">Save catalog</button>
        </div>
      </section>
      <section aria-labelledby="bridge-heading">
        <h2 id="bridge-heading">Local CLI bridge</h2>
        <label><input id="bridge" type="checkbox"> Enable native messaging bridge</label>
        <p id="bridge-status" role="status"></p>
      </section>
      <section aria-labelledby="dev-heading">
        <h2 id="dev-heading">Developer tools</h2>
        <label><input id="dev" type="checkbox"> Enable discovery, draft execution, and failure history</label>
        <p>Draft execution can change the selected site. Use a test tab when developing recipes.</p>
      </section>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
